;cursor:pointer}.toggle input{accent-color:var(--brand);width:17px;height:17px}.study-card{width:100%;max-width:720px;min-height:330px;margin:16px auto 20px;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:16px;text-align:center;border:1px solid #dce3f8;border-radius:24px;background:linear-gradient(145deg,#fff,#f4f6ff);box-shadow:0 22px 52px #29346c16;padding:32px 26px;position:relative;color:var(--ink)}.study-card.flipped{background:linear-gradient(145deg,#fff,#f1faf6);border-color:#d6eee2}.card-eyebrow{font-size:12px;color:#737e98;font-weight:800;letter-spacing:.045em}.card-word{font-size:clamp(25px,5vw,45px);font-weight:850;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}.card-reading{color:#66758e;font-size:16px;white-space:pre-wrap}.card-extras{font-size:15px;color:#60708b;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}.card-hint{font-size:12px;color:#838ba4;position:absolute;bottom:17px}.progressbar{height:9px;border-radius:20px;background:#e9edfa;overflow:hidden;margin-top:10px}.progressbar>span{height:100%;display:block;background:linear-gradient(90deg,#4e5ad0,#7f8ded);transition:width .2s}.rating-row{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.rating-row .btn{min-width:128px}.rating-label{color:var(--sub);font-size:12px;text-align:center;margin-bottom:9px}.progress-area{max-width:720px;margin:auto}.question-options{display:flex;gap:15px;flex-wrap:wrap;align-items:center}.note{border-radius:13px;background:#f2f5fc;color:#53627c;padding:14px 16px;font-size:13px;line-height:1.85}.note.warning{background:#fff6e9;color:#775626}.upload{display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:#eef1ff;color:#3946aa;border-radius:12px;font-weight:750;font-size:13px;padding:12px 17px;cursor:pointer}.upload input{display:none}.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c2946;color:#fff;border-radius:13px;padding:13px 18px;box-shadow:0 9px 30px #0003;font-size:13px;z-index:200;max-width:90vw;line-height:1.5}.hidden{display:none!important}.bullet{padding-left:20px;line-height:1.9;font-size:13px;color:var(--sub)}.footer{text-align:center;color:#99a3b5;font-size:11px;padding:20px}.kbd{font-size:11px;padding:2px 6px;background:#eff1f8;border:1px solid #dbe0ed;border-radius:5px}.sync-note{font-size:12px;color:#57647c}.tagline{display:flex;gap:5px;flex-wrap:wrap}.file-note{font-size:12px;line-height:1.8;color:var(--sub)}
  @media(max-width:740px){.quiz-options{grid-template-columns:1fr}.quiz-option{min-height:55px}.shell{padding:0 14px 45px}.topbar-inner{padding:12px 14px}.brand{font-size:19px}.topright .desktop{display:none}.nav{margin:15px 0 20px;width:100%;gap:2px;padding:5px;justify-content:space-between}.nav button{font-size:12px;padding:10px 9px;flex:1}.hero{padding:25px 22px;display:block}.hero h1{font-size:23px}.hero .btn{margin-top:19px}.hero:after{right:-20px;font-size:75px}.stats{gap:7px}.stat{padding:14px 11px}.stat-num{font-size:25px}.stat-label{font-size:11px}.page-heading{font-size:23px}.panel{padding:18px;border-radius:16px}.grid-2,.grid-3,.filter-grid,.form-grid{grid-template-columns:1fr}.wordrow{align-items:flex-start}.wordrow-actions{flex-direction:column}.study-card{min-height:285px;padding:30px 16px}.rating-row .btn{min-width:0;flex:1;padding:12px 9px}.btn{font-size:13px}.topright .pill{font-size:11px}.question-options{gap:10px}}

<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-icon" aria-hidden="true">Aa</div><div>ことばカード<div class="brand-note">自分だけの語学単語帳</div></div></div><div class="topright"><span class="pill">● <span class="desktop">端末内に</span>保存</span></div></div></header>
<main class="shell">
<nav class="nav" aria-label="メインメニュー">
<button type="button" data-tab="home" class="active">学習</button><button type="button" data-tab="list">単語一覧</button><button type="button" data-tab="add">単語を登録</button><button type="button" data-tab="data">データ管理</button>
</nav>
<div id="app" aria-live="polite"></div>
<div class="footer">ことばカード v1.2 ｜ 広告なし・アカウント登録なし ｜ 個人学習用</div>
</main>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const KEY='kotoba-cards-v1';
const LANG={en:'英語',ko:'韓国語'};
const HEADERS=['language','deck','number','word','meaning','part_of_speech','frequency_level','reading','example','example_meaning','notes','tags'];
const RECOMMENDED_POS=['名詞','動詞','形容詞','副詞','代名詞','前置詞','接続詞','助動詞','感動詞','熟語','句動詞','その他'];
const RECOMMENDED_FREQ=['でる度A','でる度B','でる度C'];
const QUIZ_DEMO=[{language:'en',deck:'お試し・英語',word:'ambiguous',meaning:'曖昧な',partOfSpeech:'形容詞',frequencyLevel:'サンプル'},{language:'en',deck:'お試し・英語',word:'deteriorate',meaning:'悪化する',partOfSpeech:'動詞',frequencyLevel:'サンプル'},{language:'en',deck:'お試し・英語',word:'contemplate',meaning:'熟考する',partOfSpeech:'動詞',frequencyLevel:'サンプル'},{language:'en',deck:'お試し・英語',word:'scarcity',meaning:'不足、希少性',partOfSpeech:'名詞',frequencyLevel:'サンプル'}];
const DEMO=[
{language:'en',deck:'お試し・英語',word:'meticulous',meaning:'細部まで注意深い',reading:'',example:'She is meticulous about her research.',exampleMeaning:'彼女は研究の細部にまで注意を払う。',notes:'',tags:'英検',partOfSpeech:'形容詞',frequencyLevel:'サンプル'},
{language:'en',deck:'お試し・英語',word:'alleviate',meaning:'（苦痛や問題を）和らげる',reading:'',example:'The policy may alleviate the burden.',exampleMeaning:'その政策は負担を軽減するかもしれない。',notes:'',tags:'英検',partOfSpeech:'動詞',frequencyLevel:'サンプル'},
{language:'en',deck:'お試し・英語',word:'resilient',meaning:'回復力のある、しなやかな',reading:'',example:'Children can be remarkably resilient.',exampleMeaning:'子どもは驚くほど回復力がある場合がある。',notes:'',tags:'英検',partOfSpeech:'形容詞',frequencyLevel:'サンプル'},
{language:'ko',deck:'お試し・韓国語',word:'도서관',meaning:'図書館',reading:'トソグァン',example:'도서관에서 공부해요.',exampleMeaning:'図書館で勉強します。',notes:'',tags:'TOPIK',partOfSpeech:'名詞',frequencyLevel:'サンプル'},
{language:'ko',deck:'お試し・韓国語',word:'약속',meaning:'約束',reading:'ヤクソク',example:'친구와 약속이 있어요.',exampleMeaning:'友達との約束があります。',notes:'',tags:'TOPIK',partOfSpeech:'名詞',frequencyLevel:'サンプル'},
{language:'ko',deck:'お試し・韓国語',word:'열심히',meaning:'一生懸命に',reading:'ヨルシミ',example:'매일 열심히 공부해요.',exampleMeaning:'毎日一生懸命に勉強します。',notes:'',tags:'TOPIK',partOfSpeech:'副詞',frequencyLevel:'サンプル'}
];
let db;
let ui={tab:'home',language:'all',deck:'all',search:'',partOfSpeech:'all',frequencyLevel:'all',editingId:null,formLang:'en',formDeck:'',study:null,quiz:null,limit:'20',dueOnly:true,direction:'word',shuffle:true};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayMs=()=>Date.now();
const nowIso=()=>new Date().toISOString();
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const txt=x=>String(x??'').trim();
const unique=arr=>[...new Set(arr)];
db=load();
function emptyDB(){return {version:1,cards:[],reviews:[]};}
function load(){try{let value=JSON.parse(localStorage.getItem(KEY)||'null');if(value&&Array.isArray(value.cards))return {version:1,cards:value.cards.filter(c=>c&&c.id&&c.word&&c.meaning).map(c=>({...c,language:c.language==='ko'?'ko':'en',deck:c.deck||'マイ単語帳',number:txt(c.number),partOfSpeech:txt(c.partOfSpeech)||(RECOMMENDED_POS.includes(txt(c.notes))?txt(c.notes):''),frequencyLevel:txt(c.frequencyLevel),interval:Number(c.interval)||0,dueAt:c.dueAt||null})),reviews:Array.isArray(value.reviews)?value.reviews:[]};}catch(e){console.warn('保存データを読み取れません',e)}return emptyDB()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true;}catch(e){alert('端末内に保存できませんでした。空き容量やブラウザの設定を確認し、「データ管理」からバックアップしてください。');return false;}}
function toast(msg){let el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3100)}
function jump(tab){ui.tab=tab;ui.study=null;ui.quiz=null;ui.editingId=null;render();window.scrollTo({top:0,behavior:'instant'});}
function isDue(c){return !c.dueAt||new Date(c.dueAt).getTime()<=todayMs();}
function inBaseScope(c){return (ui.language==='all'||c.language===ui.language)&&(ui.deck==='all'||c.deck===ui.deck)}
function posTokens(c){return txt(c.partOfSpeech).split(/[,、，\/／|;；]/).map(txt).filter(Boolean)}
function optionsOf(key){let values=db.cards.filter(inBaseScope).flatMap(c=>key==='partOfSpeech'?posTokens(c):[txt(c.frequencyLevel)]).filter(Boolean);let preferred=key==='partOfSpeech'?RECOMMENDED_POS:RECOMMENDED_FREQ;return unique(values).sort((a,b)=>{let aa=preferred.indexOf(a),bb=preferred.indexOf(b);return (aa<0?999:aa)-(bb<0?999:bb)||a.localeCompare(b,'ja',{numeric:true})});}
function normalizeFacetFilters(){if(ui.partOfSpeech!=='all'&&!optionsOf('partOfSpeech').includes(ui.partOfSpeech))ui.partOfSpeech='all';if(ui.frequencyLevel!=='all'&&!optionsOf('frequencyLevel').includes(ui.frequencyLevel))ui.frequencyLevel='all';}
function inScope(c){return inBaseScope(c)&&(ui.partOfSpeech==='all'||posTokens(c).includes(ui.partOfSpeech))&&(ui.frequencyLevel==='all'||txt(c.frequencyLevel)===ui.frequencyLevel)}
function scopeCards(){return db.cards.filter(inScope)}
function countStats(){let all=db.cards;return {total:all.length,due:all.filter(isDue).length,learned:all.filter(c=>c.lastReviewedAt).length};}
function deckNames(){return unique(db.cards.filter(c=>ui.language==='all'||ui.language===c.language).map(c=>c.deck)).sort((a,b)=>a.localeCompare(b,'ja'));}
function normalizeDeck(){if(ui.deck!=='all'&&!deckNames().includes(ui.deck))ui.deck='all';}
function langSelect(id,val='all',includeAll=true){return `<select id="${id}" class="field">${includeAll?`<option value="all" ${val==='all'?'selected':''}>すべての言語</option>`:''}<option value="en" ${val==='en'?'selected':''}>英語</option><option value="ko" ${val==='ko'?'selected':''}>韓国語</option></select>`;}
function deckSelect(id){normalizeDeck();return `<select id="${id}" class="field"><option value="all">すべての単語帳</option>${deckNames().map(d=>`<option value="${esc(d)}" ${ui.deck===d?'selected':''}>${esc(d)}</option>`).join('')}</select>`;}
function facetSelect(id,key,label){let value=ui[key],values=optionsOf(key);return `<select id="${id}" class="field facet-select"><option value="all">すべての${label}</option>${values.map(v=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`;}
function metaBadges(c){return `${c.partOfSpeech?`<span class="badge pos">${esc(c.partOfSpeech)}</span>`:''}${c.frequencyLevel?`<span class="badge freq">${esc(c.frequencyLevel)}</span>`:''}`;}
function langBadge(c){return `<span class="badge ${c.language==='ko'?'ko':''}">${LANG[c.language]||'英語'}</span>`;}
function dueLabel(c){if(!c.lastReviewedAt)return '<span class="badge gray">未学習</span>';if(isDue(c))return '<span class="badge orange">復習対象</span>';return `<span class="badge gray">次回 ${new Date(c.dueAt).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})}</span>`}
function render(){normalizeDeck();normalizeFacetFilters();document.querySelectorAll('.nav button').forEach(b=>{let selected=b.dataset.tab===ui.tab;b.classList.toggle('active',selected);b.setAttribute('aria-current',selected?'page':'false');});const views={home:home,list:list,add:add,data:data};$('app').innerHTML=views[ui.tab]();bind();}
function home(){let n=countStats();if(ui.quiz)return quizView();if(ui.study)return studyView();let decks=unique(db.cards.map(c=>c.language+'\u0000'+c.deck)).sort();return `
<div class="hero"><div><h1>今日の単語を、<br>自分のペースで覚える。</h1><p>英語も韓国語も、手持ちの教材を一つのアプリで管理。覚えた単語は間隔を空けて復習できます。</p></div><button class="btn" id="hero-study" ${n.total===0?'disabled':''}>カード学習を始める →</button></div>
<div class="stats"><div class="stat"><div class="stat-num">${n.total}</div><div class="stat-label">登録単語</div></div><div class="stat"><div class="stat-num">${n.due}</div><div class="stat-label">今日の復習対象</div></div><div class="stat"><div class="stat-num">${n.learned}</div><div class="stat-label">学習した単語</div></div></div>

<div class="study-filter-summary">現在の絞り込み条件：<strong>${scopeCards().length}語</strong>が対象です。品詞・出題頻度レベルは組み合わせて選べます。</div><div class="separator"></div><div class="question-options"><label class="toggle"><input type="checkbox" id="due-only" ${ui.dueOnly?'checked':''}> 復習対象だけを学習</label><label class="toggle"><input type="checkbox" id="shuffle" ${ui.shuffle?'checked':''}> 順番をシャッフル</label></div><p class="help">初めて登録した単語も「復習対象」に含まれます。</p><div class="btn-row" style="margin-top:19px"><button class="btn btn-primary" id="start-study" ${scopeCards().length===0?'disabled':''}>カード学習を始める</button><button class="btn btn-soft" id="start-quiz" ${scopeCards().length===0?'disabled':''}>4択クイズを始める</button><button class="btn" id="go-add">単語を追加</button></div></section>
<section class="panel"><h2 class="section-title">作成した単語帳</h2>${decks.length?`<div class="rows">${decks.slice(0,6).map(key=>{let [lang,deck]=key.split('\u0000'),count=db.cards.filter(c=>c.language===lang&&c.deck===deck).length;return `<div class="deck-card"><div><span class="badge ${lang==='ko'?'ko':''}">${LANG[lang]}</span><h3>${esc(deck)}</h3><p>${count} 語を登録</p></div><button class="btn btn-small" data-deck-study="${esc(lang+'\u0000'+deck)}">学習する</button></div>`}).join('')}</div>`:empty('まだ単語帳がありません','「単語を登録」から単語を追加するか、お試しカードを使って操作を確認できます。')}${decks.length>6?`<p class="help">ほか ${decks.length-6} 冊は「単語一覧」から確認できます。</p>`:''}</section></div>
${n.total>0?`<div class="panel" style="margin-top:18px"><div class="flex-between"><div><strong>4択クイズのお試し問題を増やす</strong><p class="help">クイズの選択肢用に英単語4語を追加します。既存データは削除されません。</p></div><button class="btn btn-soft" id="add-quiz-demo">クイズ用サンプル4語を追加</button></div></div>`:''}
${n.total===0?`<div class="panel" style="margin-top:18px"><div class="flex-between"><div><strong>まずは操作を試したい場合</strong><p class="help">英語3語・韓国語3語のサンプルを追加できます。あとで削除できます。</p></div><button class="btn btn-soft" id="add-demo">お試し単語を登録</button></div></div>`:''}`}
function empty(title,desc){return `<div class="empty"><div class="symbol" aria-hidden="true">▤</div><strong>${esc(title)}</strong><p>${esc(desc)}</p><button class="btn btn-primary" id="empty-add">最初の単語を登録する</button></div>`}
function list(){let scoped=scopeCards().filter(c=>!ui.search||(c.word+' '+c.meaning+' '+c.reading+' '+c.deck+' '+c.tags+' '+c.example+' '+c.partOfSpeech+' '+c.frequencyLevel+' '+c.number).toLocaleLowerCase().includes(ui.search.toLocaleLowerCase()));scoped.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return `<h1 class="page-heading">単語一覧</h1><p class="lead">登録した単語を検索・編集できます。教材・品詞・出題頻度レベルで絞り込めます。</p><section class="panel"><div class="filter-grid"><div><label class="label" for="language-filter">言語</label>${langSelect('language-filter',ui.language)}</div><div><label class="label" for="deck-filter">単語帳</label>${deckSelect('deck-filter')}</div><div><label class="label" for="pos-filter">品詞</label>${facetSelect('pos-filter','partOfSpeech','品詞')}</div><div><label class="label" for="freq-filter">出題頻度レベル</label>${facetSelect('freq-filter','frequencyLevel','レベル')}</div><div><label class="label" for="search-word">単語・意味・タグで検索</label><input class="field" id="search-word" value="${esc(ui.search)}" placeholder="例：meticulous / 約束"></div></div><div class="flex-between" style="margin:22px 0 14px"><strong>${scoped.length} 語を表示</strong><button class="btn btn-primary btn-small" id="go-add">＋ 新しい単語</button></div>${scoped.length?`<div class="rows">${scoped.map(c=>`<div class="wordrow"><div class="wordrow-main"><div class="wordrow-word">${esc(c.word)}</div><div class="wordrow-sub">${esc(c.meaning)}${c.reading?' · '+esc(c.reading):''}</div><div class="wordrow-meta">${langBadge(c)}<span class="badge gray">${esc(c.deck)}</span>${metaBadges(c)}${c.number?`<span class="badge gray">No. ${esc(c.number)}</span>`:''}${dueLabel(c)}</div></div><div class="wordrow-actions"><button class="btn btn-small" data-edit="${esc(c.id)}">編集</button><button class="btn btn-small btn-danger" data-delete="${esc(c.id)}">削除</button></div></div>`).join('')}</div>`:`<div class="empty"><strong>表示できる単語がありません</strong><p>条件を変えるか、新しい単語を登録してください。</p><button id="empty-add" class="btn btn-primary">単語を登録</button></div>`}</section>`;}
function add(){let item=ui.editingId?db.cards.find(c=>c.id===ui.editingId):null;let c=item||{language:ui.formLang,deck:ui.formDeck,word:'',meaning:'',reading:'',example:'',exampleMeaning:'',notes:'',tags:'',number:'',partOfSpeech:'',frequencyLevel:''};return `<h1 class="page-heading">${item?'単語を編集':'単語を登録'}</h1><p class="lead">単語と意味だけで登録できます。品詞と出題頻度レベルを登録すると、条件を絞った学習ができます。</p>
<section class="panel"><h2 class="section-title">${item?'登録内容を修正する':'1語ずつ追加する'}</h2><form id="word-form"><div class="form-grid"><div class="field-group"><label for="form-language" class="label">言語 *</label>${langSelect('form-language',c.language,false)}</div><div class="field-group"><label for="form-deck" class="label">単語帳の名前 *</label><input id="form-deck" class="field" list="existing-decks" maxlength="100" required value="${esc(c.deck)}" placeholder="例：英検1級 第1章"><datalist id="existing-decks">${unique(db.cards.map(x=>x.deck)).map(d=>`<option value="${esc(d)}"></option>`).join('')}</datalist></div><div class="field-group"><label for="form-word" class="label">外国語の単語・表現 *</label><input id="form-word" class="field" maxlength="250" required value="${esc(c.word)}" placeholder="例：meticulous / 도서관"></div><div class="field-group"><label for="form-meaning" class="label">日本語の意味 *</label><input id="form-meaning" class="field" maxlength="500" required value="${esc(c.meaning)}" placeholder="例：細部まで注意深い"></div><div class="field-group"><label for="form-number" class="label">教材内の単語番号</label><input id="form-number" class="field" maxlength="40" value="${esc(c.number)}" placeholder="例：0001"></div><div class="field-group"><label for="form-pos" class="label">品詞</label><input id="form-pos" class="field" maxlength="120" list="pos-suggestions" value="${esc(c.partOfSpeech)}" placeholder="例：名詞 / 動詞"><datalist id="pos-suggestions">${RECOMMENDED_POS.map(x=>`<option value="${x}"></option>`).join('')}</datalist></div><div class="field-group"><label for="form-frequency" class="label">出題頻度レベル</label><input id="form-frequency" class="field" maxlength="120" list="frequency-suggestions" value="${esc(c.frequencyLevel)}" placeholder="例：でる度A"><datalist id="frequency-suggestions">${unique([...RECOMMENDED_FREQ,...db.cards.map(x=>txt(x.frequencyLevel)).filter(Boolean)]).map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist></div><div class="field-group"><label for="form-reading" class="label">読み方・発音メモ</label><input id="form-reading" class="field" maxlength="250" value="${esc(c.reading)}" placeholder="例：トソグァン"></div><div class="field-group"><label for="form-tags" class="label">タグ</label><input id="form-tags" class="field" maxlength="250" value="${esc(c.tags)}" placeholder="例：動詞, 頻出, 苦手"></div><div class="field-group"><label for="form-example" class="label">例文</label><textarea id="form-example" class="field textarea" placeholder="外国語の例文">${esc(c.example)}</textarea></div><div class="field-group"><label for="form-example-meaning" class="label">例文の日本語訳</label><textarea id="form-example-meaning" class="field textarea" placeholder="例文の和訳">${esc(c.exampleMeaning)}</textarea></div><div class="form-cell-full"><label for="form-notes" class="label">補足メモ</label><textarea id="form-notes" class="field textarea" placeholder="文法・使い分け・参照ページなど">${esc(c.notes)}</textarea></div></div><div class="btn-row" style="margin-top:21px"><button type="submit" class="btn btn-primary">${item?'変更を保存':'単語を登録する'}</button>${item?`<button type="button" class="btn" id="cancel-edit">編集を中止</button>`:`<span class="help">登録後も言語と単語帳を維持して、続けて追加できます。</span>`}</div></form></section>
${!item?`<section class="panel"><h2 class="section-title">まとめて貼り付ける</h2><p class="help">Excel・スプレッドシートの「単語」「意味」の2列をコピーして貼り付けられます。1行が1語になります。</p><div class="form-grid" style="margin-top:14px"><div><label class="label" for="paste-language">言語</label>${langSelect('paste-language',ui.formLang,false)}</div><div><label class="label" for="paste-deck">単語帳</label><input id="paste-deck" class="field" value="${esc(ui.formDeck)}" placeholder="例：韓国語 初級単語"></div><div class="form-cell-full"><label class="label" for="paste-text">単語と意味のリスト</label><textarea class="field textarea" id="paste-text" style="min-height:136px" placeholder="meticulous[TAB]細部まで注意深い&#10;alleviate[TAB]和らげる"></textarea><p class="tiny muted">タブ区切りを推奨します。カンマ区切りにも対応しています。見出し行「単語　意味」はあっても構いません。</p></div></div><button class="btn btn-soft" id="paste-import">貼り付けた単語を一括登録</button></section>`:''}`;}
function data(){let n=db.cards.length;return `<h1 class="page-heading">データ管理</h1><p class="lead">一括登録、バックアップ、端末間のデータ移動に使えます。</p>
<div class="grid grid-2"><section class="panel"><h2 class="section-title">CSVファイルを取り込む</h2><p class="help">英語・韓国語を一度に取り込めます。教材の単語番号・品詞・出題頻度レベル・例文もまとめて登録できます。</p><div class="btn-row" style="margin:18px 0"><label class="upload">CSVを選択して読み込む<input type="file" id="csv-file" accept=".csv,text/csv,text/plain,.tsv"></label><button class="btn" id="csv-template">CSVひな形を保存</button></div><div class="note">主な列名：language, deck, number, word, meaning, part_of_speech, frequency_level<br>追加列：reading, example, example_meaning, notes, tags<br>language は英語なら en、韓国語なら ko と入力します。<br>必須なのは word と meaning の2列です。品詞には「名詞」「動詞」など、レベルには「でる度A」など教材の表記を入力します。</div><p class="file-note">既に登録した「言語・単語帳・単語・意味」が完全に一致する場合は重複追加せず、空欄の品詞・レベルなどを補完します。</p></section>
<section class="panel"><h2 class="section-title">バックアップと復元</h2><p class="help">${n}語の単語と学習履歴をJSON形式で保存できます。機種変更時のデータ移行にも利用してください。</p><div class="btn-row" style="margin:20px 0"><button class="btn btn-primary" id="json-export" ${n===0?'disabled':''}>バックアップを保存</button><label class="upload">バックアップを復元<input type="file" id="json-file" accept=".json,application/json"></label></div><div class="note warning"><strong>大切：</strong>単語はこの端末のアプリ内に保存されます。自動的にクラウド同期されません。定期的にバックアップを保存してください。復元時には既存データと統合します。</div></section>
<section class="panel"><h2 class="section-title">単語リストを書き出す</h2><p class="help">全単語をCSV形式で保存します。Excelなどで編集した後、再度取り込めます。</p><button class="btn btn-soft" id="csv-export" style="margin-top:17px" ${n===0?'disabled':''}>全単語をCSVで保存</button><p class="tiny muted">CSVには復習履歴は含まれません。学習履歴を残すにはJSONバックアップを使ってください。</p></section>
<section class="panel"><h2 class="section-title">単語を初期化する</h2><p class="help">すべての単語と学習履歴をこの端末から削除します。元に戻すにはバックアップが必要です。</p><button class="btn btn-danger" id="wipe-all" style="margin-top:17px" ${n===0?'disabled':''}>全データを削除する</button></section></div>
<section class="panel" style="margin-top:18px"><h2 class="section-title">iPadで使うときの注意</h2><p class="help">iPadのホーム画面に追加したアプリは、Safariで開いた画面とデータ領域が異なる場合があります。通常はホーム画面のアイコンから起動し、バックアップを活用してください。音声再生は端末に用意された音声・ブラウザの対応状況に依存します。</p></section>`;}
function studyView(){let s=ui.study;if(!s)return home();if(s.queue.length===0){return `<h1 class="page-heading">学習おつかれさまでした</h1><div class="panel"><div class="empty"><div class="symbol">✓</div><strong>今回のカード学習が完了しました</strong><p>${s.total}語を確認しました。覚えた単語は、少し日数を空けて再出題します。</p><button class="btn btn-primary" id="end-study">学習画面に戻る</button></div></div>`;}
let card=db.cards.find(c=>c.id===s.queue[0]);if(!card){s.queue.shift();return studyView()}let front=s.direction==='word'?card.word:card.meaning,back=s.direction==='word'?card.meaning:card.word;let done=s.total-unique(s.queue).length;let count=Math.min(s.total,done+1);return `<div class="flex-between"><div><h1 class="page-heading">暗記カード</h1><p class="lead" style="margin-bottom:0">${esc(card.deck)} ｜ ${card.number?'No. '+esc(card.number)+' ｜ ':''}${LANG[card.language]} ｜ ${count} / ${s.total} 語</p></div><button class="btn btn-small" id="end-study">学習を終了</button></div>
<div class="progress-area"><div class="progressbar" role="progressbar" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${s.total}"><span style="width:${Math.round(done/s.total*100)}%"></span></div>
<button id="flashcard" class="study-card ${s.flipped?'flipped':''}" type="button" aria-label="タップしてカードを${s.flipped?'表':'裏'}返す"><div class="card-eyebrow">${s.flipped?'答え':'問題'} / ${LANG[card.language]}</div><div class="card-word">${esc(s.flipped?back:front)}</div>${s.flipped&&(card.partOfSpeech||card.frequencyLevel)?`<div class="meta-strip">${metaBadges(card)}</div>`:''}${s.flipped&&card.reading?`<div class="card-reading">${esc(card.reading)}</div>`:''}${s.flipped&&card.example?`<div class="card-extras">${esc(card.example)}${card.exampleMeaning?'\n'+esc(card.exampleMeaning):''}</div>`:''}${s.flipped&&card.notes?`<div class="card-extras" style="font-size:13px">${esc(card.notes)}</div>`:''}<div class="card-hint">${s.flipped?'タップすると問題に戻ります':'タップして答えを見る'}</div></button>
<div class="btn-row" style="justify-content:center;margin-bottom:18px"><button class="btn btn-small" id="speak">♪ ${s.direction==='word'||s.flipped?'単語を読み上げる':'答えを表示して読み上げる'}</button></div>
${s.flipped?`<div class="rating-label">答えを思い出せましたか？</div><div class="rating-row"><button class="btn btn-danger" data-rating="again">もう一度</button><button class="btn" data-rating="hard">あいまい</button><button class="btn btn-primary" data-rating="good">覚えた</button></div><p class="tiny muted" style="text-align:center">「もう一度」は今回の学習の最後に再出題します。</p>`:`<div class="rating-row"><button class="btn btn-primary" id="show-answer">答えを確認する</button></div>`}
<p class="tiny muted" style="text-align:center;margin-top:18px">キーボードがある場合：<span class="kbd">Space</span> でカードを裏返せます。</p></div>`;}
function create(raw){let time=nowIso();return {id:uid(),language:raw.language==='ko'?'ko':'en',deck:txt(raw.deck)||'マイ単語帳',word:txt(raw.word),meaning:txt(raw.meaning),number:txt(raw.number),partOfSpeech:txt(raw.partOfSpeech)||(RECOMMENDED_POS.includes(txt(raw.notes))?txt(raw.notes):''),frequencyLevel:txt(raw.frequencyLevel),reading:txt(raw.reading),example:txt(raw.example),exampleMeaning:txt(raw.exampleMeaning),notes:txt(raw.notes),tags:txt(raw.tags),createdAt:time,updatedAt:time,interval:0,dueAt:null,lastReviewedAt:null,reviewCount:0};}
function addMany(raws){let bySig=new Map(db.cards.map(c=>[signature(c),c]));let count=0,updated=0,skipped=0;for(let raw of raws){let c=create(raw);if(!c.word||!c.meaning){skipped++;continue}let sig=signature(c),existing=bySig.get(sig);if(existing){let changed=false;for(let key of ['number','partOfSpeech','frequencyLevel','reading','example','exampleMeaning','notes','tags']){if(!txt(existing[key])&&txt(c[key])){existing[key]=c[key];changed=true;}}if(changed){existing.updatedAt=nowIso();updated++;}else skipped++;continue;}db.cards.push(c);bySig.set(sig,c);count++;}if(count||updated)save();return {count,updated,skipped}}
function signature(c){return [c.language,txt(c.deck),txt(c.word),txt(c.meaning)].join('\u0000')}
function bind(){if(ui.tab==='home'){if(ui.quiz){document.querySelectorAll('[data-quiz-answer]').forEach(b=>b.addEventListener('click',()=>answerQuiz(Number(b.dataset.quizAnswer))));$('next-quiz')?.addEventListener('click',nextQuiz);$('retry-quiz')?.addEventListener('click',retryQuiz);$('end-quiz')?.addEventListener('click',()=>{ui.quiz=null;render()});$('quiz-speak')?.addEventListener('click',()=>{let card=db.cards.find(c=>c.id===ui.quiz?.ids[ui.quiz.index]);if(card)speak(card)});}else if(ui.study){$('flashcard')?.addEventListener('click',()=>{ui.study.flipped=!ui.study.flipped;render()});$('show-answer')?.addEventListener('click',()=>{ui.study.flipped=true;render()});$('speak')?.addEventListener('click',()=>{let c=db.cards.find(c=>c.id===ui.study.queue[0]);if(!c)return;if(ui.study.direction==='meaning'&&!ui.study.flipped){ui.study.flipped=true;render()}speak(c)});document.querySelectorAll('[data-rating]').forEach(el=>el.addEventListener('click',()=>rate(el.dataset.rating)));$('end-study')?.addEventListener('click',()=>{ui.study=null;render()});}
else{$('hero-study')?.addEventListener('click',beginStudy);$('start-study')?.addEventListener('click',beginStudy);$('start-quiz')?.addEventListener('click',beginQuiz);$('add-quiz-demo')?.addEventListener('click',()=>{let r=addMany(QUIZ_DEMO);toast(r.count+'語を追加しました');render()});$('go-add')?.addEventListener('click',()=>jump('add'));$('empty-add')?.addEventListener('click',()=>jump('add'));$('add-demo')?.addEventListener('click',()=>{let result=addMany(DEMO);toast(result.count+'語のサンプルを追加しました');render()});document.querySelectorAll('[data-deck-study]').forEach(b=>b.addEventListener('click',()=>{let [language,deck]=b.dataset.deckStudy.split('\u0000');ui.language=language;ui.deck=deck;ui.dueOnly=false;beginStudy()}));$('language-filter')?.addEventListener('change',e=>{ui.language=e.target.value;ui.deck='all';render()});$('deck-filter')?.addEventListener('change',e=>{ui.deck=e.target.value;render()});$('pos-filter')?.addEventListener('change',e=>{ui.partOfSpeech=e.target.value;render()});$('freq-filter')?.addEventListener('change',e=>{ui.frequencyLevel=e.target.value;render()});$('direction')?.addEventListener('change',e=>ui.direction=e.target.value);$('study-limit')?.addEventListener('change',e=>ui.limit=e.target.value);$('due-only')?.addEventListener('change',e=>ui.dueOnly=e.target.checked);$('shuffle')?.addEventListener('change',e=>ui.shuffle=e.target.checked);}}
if(ui.tab==='list'){$('language-filter').addEventListener('change',e=>{ui.language=e.target.value;ui.deck='all';render()});$('deck-filter').addEventListener('change',e=>{ui.deck=e.target.value;render()});$('pos-filter').addEventListener('change',e=>{ui.partOfSpeech=e.target.value;render()});$('freq-filter').addEventListener('change',e=>{ui.frequencyLevel=e.target.value;render()});const searchBox=$('search-word');const refreshSearch=e=>{if(e.isComposing||ui.search===e.target.value)return;let start=e.target.selectionStart;ui.search=e.target.value;render();let inp=$('search-word');inp.focus();inp.setSelectionRange(start,start)};searchBox.addEventListener('input',refreshSearch);searchBox.addEventListener('compositionend',refreshSearch);$('go-add')?.addEventListener('click',()=>jump('add'));$('empty-add')?.addEventListener('click',()=>jump('add'));document.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click',()=>{ui.editingId=btn.dataset.edit;ui.tab='add';render();window.scrollTo(0,0)}));document.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click',()=>{let c=db.cards.find(c=>c.id===btn.dataset.delete);if(!c)return;if(!confirm('「'+c.word+'」を削除しますか？\nこの操作は取り消せません。'))return;db.cards=db.cards.filter(x=>x.id!==c.id);db.reviews=db.reviews.filter(r=>r.id!==c.id);save();toast('単語を削除しました');render()}));}
if(ui.tab==='add'){$('word-form').addEventListener('submit',e=>{e.preventDefault();let v=id=>$(id).value;let raw={language:v('form-language'),deck:v('form-deck'),word:v('form-word'),meaning:v('form-meaning'),number:v('form-number'),partOfSpeech:v('form-pos'),frequencyLevel:v('form-frequency'),reading:v('form-reading'),example:v('form-example'),exampleMeaning:v('form-example-meaning'),notes:v('form-notes'),tags:v('form-tags')};if(!txt(raw.deck)||!txt(raw.word)||!txt(raw.meaning)){toast('単語帳・単語・意味は必須です');return;}if(ui.editingId){let old=db.cards.find(c=>c.id===ui.editingId);if(!old)return;Object.assign(old,raw,{deck:txt(raw.deck),word:txt(raw.word),meaning:txt(raw.meaning),updatedAt:nowIso()});save();ui.editingId=null;ui.tab='list';toast('変更を保存しました');render();}else{let result=addMany([raw]);if(!result.count){toast('この単語はすでに登録されています');return;}ui.formLang=raw.language;ui.formDeck=txt(raw.deck);toast('1語を登録しました');render();$('form-word').focus();}});$('cancel-edit')?.addEventListener('click',()=>{ui.editingId=null;render()});$('paste-import')?.addEventListener('click',()=>{let input=txt($('paste-text').value),deck=txt($('paste-deck').value),lang=$('paste-language').value;if(!input||!deck){toast('単語リストと単語帳名を入力してください');return;}try{let rows=parseCSV(input);if(rows.length===0)throw Error('行がありません');if(isHeaderRow(rows[0]))rows.shift();let raws=rows.map(r=>({language:lang,deck,word:r[0],meaning:r[1],reading:r[2]||'',example:r[3]||''}));let result=addMany(raws);ui.formLang=lang;ui.formDeck=deck;toast(result.count+'語登録・'+result.updated+'語補完・'+result.skipped+'行スキップ');if(result.count){$('paste-text').value='';}}catch(err){alert('取り込みエラー: '+err.message)}});}
if(ui.tab==='data'){$('csv-template')?.addEventListener('click',downloadTemplate);$('csv-export')?.addEventListener('click',downloadCSV);$('json-export')?.addEventListener('click',()=>download('kotoba-cards-backup-'+dateSlug()+'.json',JSON.stringify({app:'kotoba-cards',exportedAt:nowIso(),data:db},null,2),'application/json;charset=utf-8'));$('csv-file')?.addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let content=await file.text(),rows=parseCSV(content);if(!rows.length)throw Error('データが空です');let rawRows=csvToRaw(rows);let r=addMany(rawRows);toast(r.count+'語登録・'+r.updated+'語補完・'+r.skipped+'行スキップ');render();}catch(err){alert('CSV読み込みに失敗しました：'+err.message)}finally{e.target.value=''}});$('json-file')?.addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let raw=JSON.parse(await file.text()),obj=raw&&raw.app==='kotoba-cards'?raw.data:raw;if(!obj||!Array.isArray(obj.cards))throw Error('ことばカードのバックアップ形式ではありません');if(!confirm(obj.cards.length+'語のバックアップを現在の単語帳に統合しますか？\n同じIDの単語は、端末にあるデータを優先します。'))return;let n=0,addedIds=new Set(),sig=new Set(db.cards.map(signature)),ids=new Set(db.cards.map(c=>c.id));for(let source of obj.cards){if(!source||!source.word||!source.meaning)continue;let c=create(source),s=signature(c);if(sig.has(s))continue;if(source.id&&!ids.has(source.id))c.id=source.id; c.interval=Math.max(0,Number(source.interval)||0);c.dueAt=source.dueAt||null;c.reviewCount=Number(source.reviewCount)||0;c.lastReviewedAt=source.lastReviewedAt||null;c.createdAt=source.createdAt||c.createdAt;db.cards.push(c);ids.add(c.id);addedIds.add(c.id);sig.add(s);n++;}if(Array.isArray(obj.reviews)){db.reviews.push(...obj.reviews.filter(r=>r&&addedIds.has(r.id)).slice(-2000));db.reviews=db.reviews.slice(-3000)}save();toast(n+'語を復元しました（既存データを保持）');render();}catch(err){alert('復元に失敗しました：'+err.message)}finally{e.target.value=''}});$('wipe-all')?.addEventListener('click',()=>{if(!confirm('すべての単語と学習履歴を削除しますか？\nこの操作は元に戻せません。'))return;if(prompt('削除する場合は「削除」と入力してください。')!=='削除'){toast('削除を中止しました');return}db=emptyDB();save();ui.language='all';ui.deck='all';ui.partOfSpeech='all';ui.frequencyLevel='all';toast('全データを削除しました');render()});}}

function quizChoicePool(card){return unique(db.cards.filter(c=>c.language===card.language&&c.id!==card.id&&txt(c.meaning)!==txt(card.meaning)).map(c=>txt(c.meaning))).filter(Boolean);}
function shuffled(xs){let a=[...xs];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function quizQuestion(card){let distractors=shuffled(quizChoicePool(card)).slice(0,3);if(distractors.length<3)return null;let options=shuffled([txt(card.meaning),...distractors]);return {id:card.id,options,correct:options.indexOf(txt(card.meaning))};}
function beginQuiz(){let selected=scopeCards().filter(c=>!ui.dueOnly||isDue(c));if(ui.shuffle)selected=shuffled(selected);selected=selected.filter(c=>quizChoicePool(c).length>=3);let limit=ui.limit==='all'?selected.length:Number(ui.limit);selected=selected.slice(0,limit);if(!selected.length){alert('4択クイズには同じ言語で意味が異なる単語が最低4語必要です。英語・韓国語それぞれ4語以上登録してください。選択した復習条件も確認してください。');return;}ui.study=null;ui.quiz={ids:selected.map(c=>c.id),index:0,correctCount:0,wrongIds:[],answered:null,question:quizQuestion(selected[0])};render();window.scrollTo(0,0);}
function quizView(){let q=ui.quiz;if(!q)return home();if(q.index>=q.ids.length){return `<h1 class="page-heading">4択クイズの結果</h1><section class="panel" style="text-align:center"><div class="stat-num">${q.correctCount} / ${q.ids.length}</div><p class="lead">正答率 ${Math.round(q.correctCount/q.ids.length*100)}% ｜ 間違い ${q.wrongIds.length}語</p>${q.wrongIds.length?`<div class="rows" style="max-width:550px;margin:14px auto;text-align:left">${q.wrongIds.map(id=>{let c=db.cards.find(x=>x.id===id);return c?`<div class="wordrow"><strong>${esc(c.word)}</strong><span>${esc(c.meaning)}</span></div>`:''}).join('')}</div><button class="btn btn-primary" id="retry-quiz">間違えた単語をもう一度</button>`:'<p>全問正解しました。</p>'}<button class="btn" style="margin:10px" id="end-quiz">学習画面に戻る</button></section>`;}
let card=db.cards.find(c=>c.id===q.ids[q.index]);if(!card)return '<p>単語が見つかりません。学習画面に戻ってください。</p>';let question=q.question;return `<div class="flex-between"><h1 class="page-heading">4択クイズ</h1><button class="btn btn-small" id="end-quiz">クイズを終了</button></div><div class="panel"><div class="flex-between"><span class="quiz-progress">${q.index+1} / ${q.ids.length} 問</span><span class="quiz-progress">正解 ${q.correctCount}問</span></div><div class="progressbar"><span style="width:${Math.round(q.index/q.ids.length*100)}%"></span></div><div class="quiz-prompt">${esc(card.word)}</div><div style="text-align:center">${langBadge(card)} ${metaBadges(card)} <button class="btn btn-small" id="quiz-speak" type="button">♪ 発音</button></div><p class="rating-label" style="margin-top:18px">この単語の意味を選んでください</p><div class="quiz-options">${question.options.map((value,i)=>`<button class="btn quiz-option ${q.answered!==null?(i===question.correct?'correct':i===q.answered?'incorrect':''):''}" data-quiz-answer="${i}" ${q.answered!==null?'disabled':''}>${'ABCD'[i]}. ${esc(value)}</button>`).join('')}</div>${q.answered!==null?`<div class="quiz-feedback"><strong>${q.answered===question.correct?'正解です':'不正解です'}</strong><div>${esc(card.word)}：${esc(card.meaning)}</div>${card.example?`<div>${esc(card.example)}</div>`:''}${card.exampleMeaning?`<div>${esc(card.exampleMeaning)}</div>`:''}</div><div class="btn-row" style="margin-top:18px;justify-content:flex-end"><button class="btn btn-primary" id="next-quiz">${q.index+1===q.ids.length?'結果を見る':'次の問題へ →'}</button></div>`:''}</div>`;}
function answerQuiz(choice){let q=ui.quiz;if(!q||q.answered!==null||!q.question)return;let card=db.cards.find(c=>c.id===q.question.id);if(!card)return;q.answered=choice;let good=choice===q.question.correct;if(good)q.correctCount++;else q.wrongIds.push(card.id);let old=Math.max(0,Number(card.interval)||0),n=todayMs();card.interval=good?(old?Math.max(2,Math.round(old*2.3)):2):0;card.dueAt=new Date(n+(good?card.interval*86400000:10*60000)).toISOString();card.lastReviewedAt=nowIso();card.updatedAt=card.lastReviewedAt;card.reviewCount=(Number(card.reviewCount)||0)+1;db.reviews.push({id:card.id,date:card.lastReviewedAt,rating:good?'good':'again',mode:'quiz'});db.reviews=db.reviews.slice(-3000);save();render();}
function nextQuiz(){let q=ui.quiz;if(!q||q.answered===null)return;q.index++;q.answered=null;if(q.index<q.ids.length){let card=db.cards.find(c=>c.id===q.ids[q.index]);q.question=card?quizQuestion(card):null;}render();}
function retryQuiz(){let q=ui.quiz;if(!q||!q.wrongIds.length)return;let ids=shuffled(q.wrongIds);ui.quiz={ids,index:0,correctCount:0,wrongIds:[],answered:null,question:quizQuestion(db.cards.find(c=>c.id===ids[0]))};render();}

function beginStudy(){let cards=scopeCards().filter(c=>!ui.dueOnly||isDue(c));if(ui.shuffle){for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}}let limit=ui.limit==='all'?cards.length:Number(ui.limit);cards=cards.slice(0,limit);if(!cards.length){toast('学習対象がありません。「復習対象だけ」をオフにしてみてください');return;}ui.study={queue:cards.map(c=>c.id),total:cards.length,direction:ui.direction,flipped:false};render();window.scrollTo(0,0)}
function rate(rating){let s=ui.study;if(!s?.queue.length)return;let id=s.queue.shift(),c=db.cards.find(x=>x.id===id);if(!c)return;let n=todayMs(),old=Math.max(0,Number(c.interval)||0),days=0;if(rating==='again'){c.interval=0;c.dueAt=new Date(n+10*60*1000).toISOString();s.queue.push(id);}else{days=rating==='hard'?(old?Math.max(1,Math.round(old*1.15)):1):(old?Math.max(2,Math.round(old*2.3)):2);c.interval=days;c.dueAt=new Date(n+days*86400000).toISOString();}c.reviewCount=(Number(c.reviewCount)||0)+1;c.lastReviewedAt=nowIso();c.updatedAt=nowIso();db.reviews.push({id,date:c.lastReviewedAt,rating});db.reviews=db.reviews.slice(-3000);s.flipped=false;save();render();}
function speak(c){if(!('speechSynthesis' in window)){toast('この端末では読み上げ機能を使用できません');return;}try{window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(c.word);u.lang=c.language==='ko'?'ko-KR':'en-US';u.rate=.87;const voices=window.speechSynthesis.getVoices(),v=voices.find(x=>x.lang.toLowerCase().startsWith(c.language==='ko'?'ko':'en'));if(v)u.voice=v;window.speechSynthesis.speak(u);}catch(e){toast('音声の再生に失敗しました')}}
function parseCSV(input){let s=String(input).replace(/^\ufeff/,'');if(!s.trim())return [];let first=s.split(/\r?\n/,1)[0];let delimiter=first.includes('\t')?'\t':',';let out=[],row=[],cell='',quoted=false;for(let i=0;i<s.length;i++){let ch=s[i];if(quoted){if(ch==='"'&&s[i+1]==='"'){cell+='"';i++;}else if(ch==='"'){quoted=false;}else cell+=ch;}else if(ch==='"'&&cell===''){quoted=true;}else if(ch===delimiter){row.push(cell);cell='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(x=>txt(x)))out.push(row);row=[];cell='';}else cell+=ch;}if(quoted)throw Error('引用符が閉じられていません');row.push(cell);if(row.some(x=>txt(x)))out.push(row);return out;}
const ALIAS={language:['language','言語','lang'],deck:['deck','単語帳','教材','book'],word:['word','単語','英単語','韓国語','term','expression','front'],meaning:['meaning','意味','日本語','訳','和訳','back'],number:['number','no','番号','単語番号','掲載番号','通し番号'],part_of_speech:['part_of_speech','partofspeech','pos','品詞'],frequency_level:['frequency_level','frequencylevel','frequency','level','頻度','出題頻度','出題頻度レベル','でる度','レベル'],reading:['reading','読み方','発音','読み'],example:['example','例文'],example_meaning:['example_meaning','例文訳','例文の訳','例文和訳'],notes:['notes','メモ','備考'],tags:['tags','タグ']};
function headerIndex(row){let m={};row.forEach((x,i)=>{let v=txt(x).toLowerCase().replace(/\s/g,'');for(let [k,aliases] of Object.entries(ALIAS))if(aliases.includes(v)&&m[k]===undefined)m[k]=i;});return m;}
function isHeaderRow(row){let m=headerIndex(row);return m.word!==undefined&&m.meaning!==undefined;}
function csvToRaw(rows){let header=isHeaderRow(rows[0])?headerIndex(rows.shift()):{word:0,meaning:1,reading:2,example:3};let get=(r,k)=>header[k]===undefined?'':txt(r[header[k]]);return rows.map(r=>{let l=get(r,'language').toLowerCase();return {language:['ko','kr','korean','韓国語'].includes(l)?'ko':(['en','english','英語'].includes(l)?'en':/[\uac00-\ud7af]/.test(get(r,'word'))?'ko':'en'),deck:get(r,'deck')||'CSV取り込み',word:get(r,'word'),meaning:get(r,'meaning'),number:get(r,'number'),partOfSpeech:get(r,'part_of_speech'),frequencyLevel:get(r,'frequency_level'),reading:get(r,'reading'),example:get(r,'example'),exampleMeaning:get(r,'example_meaning'),notes:get(r,'notes'),tags:get(r,'tags')};});}
function serializeCSV(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');}
function dateSlug(){return new Date().toISOString().slice(0,10)}
function download(filename,contents,type){let blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function downloadTemplate(){let rows=[HEADERS,['en','英検1級 練習用','0001','meticulous','細部まで注意深い','形容詞','でる度A','','She is meticulous about her work.','彼女は仕事の細部まで気を配る。','','英検'],['ko','韓国語 練習用','0001','도서관','図書館','名詞','初級','トソグァン','도서관에 가요.','図書館に行きます。','','TOPIK']];download('kotoba-cards-template.csv','\ufeff'+serializeCSV(rows),'text/csv;charset=utf-8');}
function downloadCSV(){let rows=[HEADERS,...db.cards.map(c=>[c.language,c.deck,c.number,c.word,c.meaning,c.partOfSpeech,c.frequencyLevel,c.reading,c.example,c.exampleMeaning,c.notes,c.tags])];download('kotoba-cards-words-'+dateSlug()+'.csv','\ufeff'+serializeCSV(rows),'text/csv;charset=utf-8');}
document.querySelectorAll('.nav button').forEach(btn=>btn.addEventListener('click',()=>jump(btn.dataset.tab)));
document.addEventListener('keydown',e=>{if(e.code!=='Space'||ui.tab!=='home'||!ui.study?.queue.length)return;let target=e.target;if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(target.tagName))return;e.preventDefault();ui.study.flipped=!ui.study.flipped;render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('オフライン登録失敗',e));
render();
})();
